<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Detail — Zaidan Ghifar</title>
  <link rel="stylesheet" href="page 2.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="bg-overlay"></div>

  <!-- Tombol Back to Works -->
  <a href="../ikiweh.html#works" class="back-link">&larr; BACK TO WORKS</a>

  <!-- Tombol Navigasi Panah -->
  <button class="nav-btn prev-btn" id="prevBtn" aria-label="Previous">&lt;</button>
  <button class="nav-btn next-btn" id="nextBtn" aria-label="Next">&gt;</button>

  <!-- Container Slider Utama -->
  <div class="slider-viewport">
    <div class="slider-track" id="sliderTrack">

      <!-- SLIDE 1 (1 Gambar Lanskap / Board TransJogja) -->
      <div class="slide-item">
        <img src="../tj layout simple fx.jpg" alt="TransJogja Detail 1">
      </div>

      <!-- SLIDE 2 -->
      <div class="slide-item">
        <img src="../jb.jpg" alt="TransJogja Detail 2">
      </div>

      <!-- SLIDE 3 -->
      <div class="slide-item">
        <img src="../logo.jpg" alt="TransJogja Detail 2">
      </div>

    </div>
  </div>

  <script>
    const track = document.getElementById('sliderTrack');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const slides = document.querySelectorAll('.slide-item');

    let currentIndex = 0;

    function updateSlider() {
      track.style.transform = `translateX(-${currentIndex * 100}%)`;
    }

    nextBtn.addEventListener('click', () => {
      if (currentIndex < slides.length - 1) {
        currentIndex++;
      } else {
        currentIndex = 0;
      }
      updateSlider();
    });

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
      } else {
        currentIndex = slides.length - 1;
      }
      updateSlider();
    });
  </script>
</body>
</html>
